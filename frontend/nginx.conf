# ห้าม browser เก็บ index.html ไว้ (ไฟล์อื่นไม่ส่ง header นี้ เพราะค่าว่าง = nginx ไม่ส่ง)
# index.html ของ /ai/ กับ /ai2/ มีขนาดและเวลาเท่ากัน ETag เลยซ้ำกัน ถ้า browser เคยได้หน้าผิดธีม
# ไว้ เซิร์ฟเวอร์จะตอบ 304 "ไม่เปลี่ยน" แล้วหน้าผิดธีมจะค้างอยู่อย่างนั้น
# ส่วน js/css ชื่อไฟล์เปลี่ยนทุก build อยู่แล้ว จึง cache ยาวได้ตามเดิม
map $sent_http_content_type $sb_cache_control {
    ~^text/html "no-store";
    default     "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $sb_cache_control;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static assets: safe to cache long-term (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # เสิร์ฟใต้ path ย่อย /ai/ ด้วย (สำหรับ NPM proxy บนเซิร์ฟเวอร์โรงเรียน
    # ที่ forward request แบบคงเดิม เช่น /ai/assets/xxx.js มาให้ container นี้
    # โดยไม่ตัด prefix ออก) — alias ตัด /ai/ ออกก่อนไปหาไฟล์จริงใน html/
    location /ai/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /ai/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ai/index.html;
    }

    location = /ai {
        return 301 /ai/;
    }

    # path ย่อย /ai2/ สำหรับเว็บธีมแดง-ทอง (container signbridge-frontend-ai2) ทำงานแบบเดียวกับ /ai/
    location /ai2/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /ai2/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ai2/index.html;
    }

    location = /ai2 {
        return 301 /ai2/;
    }
}
