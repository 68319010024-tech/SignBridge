# SignBridge - deploy stack สำหรับเซิร์ฟเวอร์จริง (environment "rov2" ใน Portainer)
#
# ต่างจาก docker-compose.yml (ตัวสำหรับทดสอบในเครื่อง/โน้ตบุ๊คเอง ที่ยังใช้
# http://localhost:8080 ได้ตามปกติ) ไฟล์นี้ผูก network เข้ากับ multi-host_default
# ซึ่งเป็น network เดิมของ Nginx Proxy Manager ที่มีอยู่แล้วบนเซิร์ฟเวอร์ เพื่อให้ NPM
# เรียก container นี้ด้วยชื่อ "signbridge-frontend" ได้เลย โดยไม่ publish พอร์ตออกสู่
# host เพื่อกันชนกับ service อื่นที่แชร์เครื่องเดียวกันอยู่ (เช่น E-Sport)
#
# วิธี deploy:
#   Portainer -> environment "rov2" -> Stacks -> Add stack -> Repository
#   -> Repository URL: (URL ของ repo นี้บน GitHub)
#   -> Reference: refs/heads/master
#   -> Compose path: docker/docker-compose.deploy.yml
#   -> Deploy the stack
#
# จากนั้นไปตั้งค่าใน NPM: Hosts -> Proxy Hosts -> แก้ host ของ webapp.htc.ac.th
# (ห้ามลบของเดิม) -> แท็บ Advanced -> ต่อท้าย Custom Nginx Configuration ด้วย:
#
#   location /ai/ws/ {
#       resolver 127.0.0.11 valid=10s ipv6=off;
#       set $sb_engine signbridge-ai-engine;
#       proxy_pass http://$sb_engine:8000;
#       proxy_http_version 1.1;
#       proxy_set_header Upgrade $http_upgrade;
#       proxy_set_header Connection "upgrade";
#       proxy_set_header Host $host;
#   }
#   location /ai/ {
#       resolver 127.0.0.11 valid=10s ipv6=off;
#       set $sb_ai signbridge-frontend;
#       proxy_pass http://$sb_ai:80;
#       proxy_set_header Host $host;
#   }
#   location /ai2/ {
#       resolver 127.0.0.11 valid=10s ipv6=off;
#       set $sb_ai2 signbridge-frontend-ai2;
#       proxy_pass http://$sb_ai2:80;
#       proxy_set_header Host $host;
#   }
#
# ทำไมไม่ใช้แท็บ Custom Locations: NPM เขียน proxy_pass แบบชื่อตรงๆ ซึ่ง nginx แปลงชื่อเป็น IP
# แค่ครั้งเดียวตอนโหลด config แต่ทุกครั้งที่ redeploy stack นี้ container จะได้ IP ใหม่
# NPM จึงส่งไปผิดตัว (เคยเกิด /ai2/ ได้หน้าธีม /ai/ และ /ai/ 502) จนกว่าจะกด Save ใน NPM ใหม่
# แบบข้างบนใช้ตัวแปร + resolver ของ Docker (127.0.0.11) nginx จึงถามหา IP ใหม่ทุก 10 วินาที
# ถ้าเคยตั้งไว้ใน Custom Locations (/ai/, /ai/ws/, /ai2/) ต้องลบออกก่อน ไม่งั้นชื่อ location ซ้ำกัน
# ทั้ง 2 เว็บ (/ai/ และ /ai2/) ใช้ ai-engine ตัวเดียวกันผ่าน /ai/ws/

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: signbridge-frontend
    restart: unless-stopped
    networks:
      - multi-host_default

  frontend-ai2:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        SB_THEME: red
    container_name: signbridge-frontend-ai2
    restart: unless-stopped
    networks:
      - multi-host_default

  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: signbridge-ai-engine
    restart: unless-stopped
    networks:
      - multi-host_default

networks:
  multi-host_default:
    external: true
